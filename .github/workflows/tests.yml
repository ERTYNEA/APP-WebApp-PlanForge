name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: planforge-pipeline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tests:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-dotnet@v6.1.0
        with:
          global-json-file: global.json
      - name: Reject credential files and embedded access tokens
        shell: python
        run: |
          import pathlib, re, subprocess
          paths = subprocess.check_output(['git', 'ls-files', '-z'], text=True).split('\0')
          for path in filter(None, paths):
              lower = path.lower()
              assert not any(part in {'.secrets', 'publishprofiles'} for part in pathlib.PurePosixPath(path).parts), 'Private directory tracked'
              assert not lower.endswith(('.publishsettings', '.pfx', '.pem', '.key')), 'Credential file tracked'
              assert pathlib.PurePosixPath(path).name != 'local.settings.json', 'Private Functions settings tracked'
              data = pathlib.Path(path).read_bytes()
              assert not re.search(rb'gh[pousr]_[A-Za-z0-9]{30,}|github_pat_[A-Za-z0-9_]{40,}|-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----', data), 'Embedded access credential detected'
      - run: dotnet restore APP-WebApp-PlanForge.slnx
      - run: dotnet restore src/PlanForge.Api
      - run: python3 -m unittest discover -s tests/pipeline -v
      - run: node --test tests/browser/ui.test.cjs
      - run: dotnet build APP-WebApp-PlanForge.slnx --configuration Release --no-restore
      - run: dotnet test APP-WebApp-PlanForge.slnx --configuration Release --no-build --logger trx --results-directory TestResults
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: test-results
          path: TestResults/*.trx
  changes:
    name: Detect deployment scope
    runs-on: ubuntu-latest
    outputs:
      database: ${{ steps.scope.outputs.database }}
      api: ${{ steps.scope.outputs.api }}
      web: ${{ steps.scope.outputs.web }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - id: scope
        env:
          BEFORE: ${{ github.event.before }}
          EVENT: ${{ github.event_name }}
        run: python3 scripts/deployment-scope.py
  database:
    name: Deploy database
    needs: [tests, changes]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.changes.outputs.database == 'true'
    uses: ./.github/workflows/deploy-database.yml
    secrets:
      migration-connection: ${{ secrets.AZURE_SQL_MIGRATION_CONNECTION_STRING }}
  api:
    name: Deploy API
    needs: [tests, changes, database]
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.tests.result == 'success' && needs.changes.result == 'success' && needs.changes.outputs.api == 'true' && needs.database.result == 'success' }}
    uses: ./.github/workflows/deploy-api.yml
    secrets:
      publish-profile: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}
  web:
    name: Deploy Web
    needs: [tests, changes, database, api]
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.tests.result == 'success' && needs.changes.result == 'success' && needs.changes.outputs.web == 'true' }}
    uses: ./.github/workflows/deploy-web.yml
    with:
      test-result: ${{ needs.tests.result }}
      scope-result: ${{ needs.changes.result }}
      database-required: ${{ needs.changes.outputs.database == 'true' }}
      database-result: ${{ needs.database.result }}
      api-required: ${{ needs.changes.outputs.api == 'true' }}
      api-result: ${{ needs.api.result }}
    secrets:
      publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}